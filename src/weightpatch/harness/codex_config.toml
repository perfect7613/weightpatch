# Tools-off Codex profile. Every built-in capability that hands the model a tool
# is disabled; the only way the agent acts is by writing one Python block that
# WeightPatch runs in its own weight kernel. Mirrors the MIT weight-space
# programming harness (RikiyaT/lm_understand-logs, harness/codex_config.toml).
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"
model_reasoning_summary = "detailed"  # reasoning summaries land in each turn's events.jsonl
model_instructions_file = "__INSTRUCTIONS__"

[agents]
enabled = false

[features]
code_mode = false
collaboration_modes = false
shell_tool = false
unified_exec = false
unified_exec_tty = false
shell_snapshot = false
view_image = false
image_generation = false
multi_agent = false
apps = false
plugins = false
remote_plugin = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
in_app_browser = false
computer_use = false
code_mode_host = false
skill_search = false
skill_mcp_dependency_install = false
sleep_tool = false
tool_suggest = false
goals = false
hooks = false
worktrees = false
workspace_dependencies = false
