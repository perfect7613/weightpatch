[project]
name = "weightpatch"
version = "0.1.0"
description = "Agent-driven weight-space repair harness: an LLM edits a model's weights through localization tools, checked by a grader it cannot see."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
hf = ["transformers>=5.15,<6", "tokenizers>=0.20"]
dev = ["pytest>=8", "transformers>=5.15,<6", "tokenizers>=0.20"]
# Lexsi's stack: the tools, the evaluator and the drift tiers are built on these
lexsi = ["safetune>=0.1.12,<0.2", "circuitkit==0.2.3", "auditkit==1.1.11", "datasets", "peft", "accelerate"]
modal = ["modal>=1.0"]

[project.scripts]
weightpatch = "weightpatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightpatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Codex CLI on the user's subscription (opt in with -m live)"]
addopts = "-m 'not live'"
